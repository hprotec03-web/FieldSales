name: fieldsales_mobile
description: FieldSales field-sales tracking app (Android + iOS) - Flutter client for the FieldSales API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Versions are compatible-release ranges; run `flutter pub get` and commit the generated pubspec.lock.
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
