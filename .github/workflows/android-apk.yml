name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Address of your FieldSales API that the phone can reach (e.g. http://192.168.1.20:8001 or https://api.example.com)"
        required: true
        default: "http://85.237.211.180:8001"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      API_URL: ${{ github.event.inputs.api_base_url || 'http://85.237.211.180:8001' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate android/ and ios/ folders and add FieldSales permissions
        run: bash tool/setup_platforms.sh

      - name: Apply Android Gradle settings (minSdk 23, desugaring)
        run: python3 tool/patch_gradle.py

      - name: Static analysis (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Unit tests (informational)
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fieldsales-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
